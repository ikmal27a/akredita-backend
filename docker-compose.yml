# Docker Compose untuk development — jalankan dengan: docker compose up
# Includes: PostgreSQL + Node backend
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: akredita
      POSTGRES_PASSWORD: akredita
      POSTGRES_DB: akredita
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akredita"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://akredita:akredita@postgres:5432/akredita?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-please-change-in-production-this-is-not-secure}
      PORT: 3001
      UPLOAD_DIR: /app/uploads
      CORS_ORIGIN: http://localhost:5173,http://localhost:8000
    ports:
      - "3001:3001"
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
